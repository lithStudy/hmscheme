# Application configuration

# Path to food database Excel
foods.excel=src/main/resources/foods.xlsx

# Path to export Excel (will be created or appended)
export.excel=meal_solutions.xlsx

# Excluded categories when building food database (comma-separated of FoodCategory enum names)
exclude.categories=FRUIT,OIL,PASTRY,MILK

# Require exactly one staple in each meal
require.staple=true

# Meals per day to derive per-meal nutrient target (target = daily * (1 / meals.per_day))
meals.per_day=3

# Algorithm profile: small | standard | large
algorithm.profile=large

# Logger settings
log.level=INFO
log.verboseObjectives=false
log.verbosePopulation=false

# Random seed (optional), leave blank to use system time
random.seed=

# Objectives: structure and weights
# Expand composite objectives (nutrients macro/micro, diversity, balance) into sub-goals
objectives.expandComposite=false

# Top-level objective weights (when using composites)
weights.nutrients.macro=0.5
weights.nutrients.micro=0.5
weights.preference=0.2
weights.diversity=0.2
weights.balance=0.2

# Optional fine-grained weights (leave empty to keep defaults inside objectives)
# diversity.weights.category=
# diversity.weights.attribute=
# diversity.weights.combination=
# balance.weights.macroRatio=

